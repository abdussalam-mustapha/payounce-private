[package]
name = "payounce_private"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Payounce Private: rotating savings circles with private payouts on Tari Ootle"

[dependencies]
tari_template_lib = "0.40.1"

[dev-dependencies]
# Versions must match the Ootle network release; confirm against `tari create` output.
tari_template_test_tooling = "0.53.5"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
